<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Próxima Aula — Braga Treinamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Lexend:wght@300;400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#0f1a1a;--ink:#e3eeeb;--accent:#4cc2ae;--muted:#9db2ae;--line:#2a3a38;--gold:#f5c518;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Lexend","Segoe UI",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{max-width:560px;width:100%;text-align:center;display:grid;gap:24px}
.logo-badge{width:72px;height:72px;background:var(--gold);border-radius:50%;display:inline-grid;place-items:center;font-family:"Bricolage Grotesque",system-ui;font-weight:800;font-size:1.9rem;color:#0f1a1a;margin:0 auto}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:"Bricolage Grotesque",system-ui;font-size:clamp(2rem,5vw,3rem);font-weight:800;line-height:1.1;letter-spacing:-.02em}
.sub{font-size:1rem;color:var(--muted);line-height:1.6;max-width:42ch;margin:0 auto}
.countdown{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.unit{background:#172221;border:1px solid var(--line);border-radius:12px;padding:16px 20px;min-width:70px}
.num{font-family:"Bricolage Grotesque",system-ui;font-size:2.2rem;font-weight:800;color:var(--accent);line-height:1}
.lbl{font-family:"JetBrains Mono",monospace;font-size:.65rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-size:.9rem;transition:color .2s}
.back:hover{color:var(--accent)}
.plat{font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--muted)}
.plat a{color:var(--gold);text-decoration:none;font-weight:600}
.plat a:hover{text-decoration:underline}
</style></head><body>
<div class="card">
  <div>
    <div class="logo-badge">B</div>
  </div>
  <div class="eyebrow">Braga Treinamentos · Excel Avançado</div>
  <h1>Próxima aula em breve</h1>
  <p class="sub">Esta aula ainda não foi liberada. Volte no dia da aula para acessar o conteúdo completo com prints passo a passo.</p>
  <div class="countdown">
    <div class="unit"><div class="num" id="d">--</div><div class="lbl">Dias</div></div>
    <div class="unit"><div class="num" id="h">--</div><div class="lbl">Horas</div></div>
    <div class="unit"><div class="num" id="m">--</div><div class="lbl">Min</div></div>
    <div class="unit"><div class="num" id="s">--</div><div class="lbl">Seg</div></div>
  </div>
  <p class="plat">Acesse todas as aulas em <a href="https://bragatreinamentos.com.br/" target="_blank" rel="noopener">bragatreinamentos.com.br</a></p>
  <a class="back" href="../">← Voltar para a aula atual</a>
</div>
<script>
// Coloque aqui a data da próxima aula (AAAA, MM-1, DD, HH, MM)
var target = new Date(2026, 9, 12, 8, 0, 0); // 12/10/2026 às 08:00
function tick(){
  var now=new Date(), diff=target-now;
  if(diff<=0){document.querySelector('.card').innerHTML='<h1 style="color:var(--accent)">A aula começa agora! 🎉</h1><p>Recarregue a página.</p>';return;}
  var d=Math.floor(diff/864e5),h=Math.floor((diff%864e5)/36e5),m=Math.floor((diff%36e5)/6e4),s=Math.floor((diff%6e4)/1e3);
  document.getElementById('d').textContent=String(d).padStart(2,'0');
  document.getElementById('h').textContent=String(h).padStart(2,'0');
  document.getElementById('m').textContent=String(m).padStart(2,'0');
  document.getElementById('s').textContent=String(s).padStart(2,'0');
}
tick(); setInterval(tick,1000);
</script>
</body></html>
